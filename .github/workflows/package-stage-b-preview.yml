name: Package Commercial Operations Preview

on:
  push:
    tags:
      - "v0.3.2-commercial-operations-preview-*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source packages
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          echo "Building ${VERSION}"

          mkdir -p dist/package

          git archive --format=tar HEAD | tar -xf - -C dist/package

          echo "Cleaning development files..."

          rm -rf \
            dist/package/.git \
            dist/package/backend/venv \
            dist/package/frontend/node_modules \
            dist/package/frontend/.next \
            dist/package/logs \
            dist/package/uploads \
            dist/package/backups \
            dist/package/.github

          cat > dist/package/BUILD_INFO.txt <<EOF
Project: 蜗牛群聊精灵

Version:
${VERSION}

Commit:
${GITHUB_SHA}

Branch:
commercial-operations-v0.3.2

Package:
Stage C Commercial Operations Preview

Features:
- Commercial backend management
- Agent management
- Customer management
- License code operations
- Diamond quota ledger
- Refund/idempotency protection
- Commercial operation audit

Validation:
- Backend tests passed
- Frontend build passed

Production:
Deployment: NO

Database migration:
020/021/022 production migration executed: NO
EOF


          echo "Creating ZIP..."

          (
            cd dist/package
            zip -qr \
              "../snail-chat-elf-${VERSION}.zip" .
          )


          echo "Creating TAR.GZ..."

          (
            cd dist/package
            tar -czf \
              "../snail-chat-elf-${VERSION}.tar.gz" .
          )


          cd dist


          echo "Generating SHA256..."

          sha256sum \
            "snail-chat-elf-${VERSION}.zip" \
            "snail-chat-elf-${VERSION}.tar.gz" \
            > SHA256SUMS.txt


          echo "Package result:"
          ls -lh


      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snail-chat-elf-${{ github.ref_name }}
          path: |
            dist/snail-chat-elf-${{ github.ref_name }}.zip
            dist/snail-chat-elf-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 30


      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release create \
            "${GITHUB_REF_NAME}" \
            "dist/snail-chat-elf-${GITHUB_REF_NAME}.zip" \
            "dist/snail-chat-elf-${GITHUB_REF_NAME}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --title "蜗牛群聊精灵 ${GITHUB_REF_NAME}" \
            --notes "
Stage C 商业运营后台预览版本。

包含：
- 商业运营后台
- 代理商管理
- 客户管理
- 授权码管理
- 钻石额度流水
- 幂等保护
- 商业审计日志

验证：
- Backend pytest passed
- Concurrency tests passed
- Frontend build passed

注意：
此版本未部署生产。
020/021/022 未执行生产迁移。
"
