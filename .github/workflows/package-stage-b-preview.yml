name: Package Commercial Operations Preview

on:
  push:
    tags:
      - "v0.3.2-commercial-operations-preview-*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Build source packages
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          echo "Building ${VERSION}"

          mkdir -p dist/package

          git archive --format=tar HEAD | tar -xf - -C dist/package


          rm -rf \
            dist/package/.git \
            dist/package/backend/venv \
            dist/package/frontend/node_modules \
            dist/package/frontend/.next \
            dist/package/logs \
            dist/package/uploads \
            dist/package/backups \
            dist/package/.github


          {
            echo "Project: 蜗牛群聊精灵"
            echo "Version: ${VERSION}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: commercial-operations-v0.3.2"
            echo "Package: Stage C Commercial Operations Preview"
            echo "Production deployment: NO"
            echo "Production migration 020/021/022: NO"
          } > dist/package/BUILD_INFO.txt


          cd dist/package

          zip -qr \
            "../snail-chat-elf-${VERSION}.zip" .


          tar -czf \
            "../snail-chat-elf-${VERSION}.tar.gz" .


          cd ..

          sha256sum \
            "snail-chat-elf-${VERSION}.zip" \
            "snail-chat-elf-${VERSION}.tar.gz" \
            > SHA256SUMS.txt


      - name: Upload artifacts
        uses: actions/upload-artifact@v4

        with:
          name: snail-chat-elf-${{ github.ref_name }}

          path: |
            dist/snail-chat-elf-${{ github.ref_name }}.zip
            dist/snail-chat-elf-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS.txt


      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |

          gh release create \
            "${GITHUB_REF_NAME}" \
            "dist/snail-chat-elf-${GITHUB_REF_NAME}.zip" \
            "dist/snail-chat-elf-${GITHUB_REF_NAME}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --title "蜗牛群聊精灵 ${GITHUB_REF_NAME}" \
            --notes "Stage C Commercial Operations Preview. Production deployment NO. Migration 020/021/022 NOT executed."
